name: HACS Validation

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Brands: no home-assistant/brands entry yet. Topics: set them in the
          # repository settings, then drop "topics" here.
          ignore: brands topics
