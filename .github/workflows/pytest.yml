name: Python Tests

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python 3.13, ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest Home Assistant that runs on Python 3.13.
          - ha: current
            requirements: requirements_test.txt
          # The minimum declared in hacs.json.
          - ha: minimum
            requirements: requirements_test_min.txt
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}
      - name: Lint
        run: ruff check custom_components tests kerb_core && ruff format --check custom_components tests kerb_core
      - name: Run tests
        run: pytest -q --cov=custom_components/kerb --cov-report=term-missing
