lock:
  fields:
    child:
      required: true
      example: Alice
      selector:
        text:
    duration:
      required: false
      example: "01:00:00"
      selector:
        duration:
    scope:
      required: false
      default: all
      example: PS5
      selector:
        text:
    mode:
      required: false
      default: auto
      selector:
        select:
          options:
            - auto
            - pause
            - zero_allowance
            - network
            - power
            - manual
          translation_key: mode
    reason:
      required: false
      example: dinner
      selector:
        text:
    pin:
      required: false
      selector:
        text:
          type: password
